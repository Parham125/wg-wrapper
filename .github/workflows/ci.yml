name: ci
on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      - run: cargo test --workspace
      - name: Build the Windows GUI client
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path crates/client-win/src-tauri/resources | Out-Null
          Set-Content -Path crates/client-win/src-tauri/resources/wintun.dll -Value "" # placeholder, this step only compiles
          cargo build --manifest-path crates/client-win/src-tauri/Cargo.toml
